<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lcserver admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--bg2:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--red:#f85149;--green:#3fb950;--yellow:#d2991d;--rank:#ff7b72}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:16px;font-weight:600}
.stats{display:flex;gap:20px;font-size:12px}
.stat{padding:4px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px}
.stat span{color:var(--muted)} .stat strong{color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:20px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.search{flex:1;max-width:300px;padding:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--accent)}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;background:var(--bg2);color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--accent)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{opacity:.9}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);letter-spacing:.5px}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover{background:var(--bg2)}
.uuid{font-family:monospace;font-size:11px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--rank);color:#000}
.rank-badge.admin{background:var(--red);color:#fff}
.rank-badge.vip{background:var(--yellow);color:#000}
.rank-badge.default{background:var(--border);color:var(--text)}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.online-dot.on{background:var(--green)}
.online-dot.off{background:var(--border)}
.clickable{cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.clickable:hover{color:#fff}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:8px;width:500px;max-height:80vh;overflow-y:auto;padding:24px}
.modal h2{font-size:15px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;letter-spacing:.5px}
.field input,.field select{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:12px;border-top:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:11px;display:flex;align-items:center;gap:4px}
.chip-del{color:var(--red);cursor:pointer;font-weight:bold}
.chip-del:hover{color:#fff}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:6px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.ok{background:var(--green);color:#000}
.toast.err{background:var(--red);color:#fff}
.loading{text-align:center;padding:40px;color:var(--muted)}
.empty{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>lcserver admin</h1>
  <div class="stats">
    <div class="stat"><span>online</span> <strong id="stat-online">-</strong></div>
    <div class="stat"><span>total</span> <strong id="stat-total">-</strong></div>
  </div>
</header>
<main>
  <div class="toolbar">
    <input class="search" id="search" placeholder="Filter by username or uuid..." oninput="render()">
    <button class="btn" onclick="loadPlayers()">Refresh</button>
    <button class="btn btn-accent" onclick="showCreate()">+ Add Player</button>
  </div>
  <div id="table"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Edit Player</h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveProfile()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api';
let players = [];
let online = [];
let editing = null;

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadPlayers() {
  try {
    const [p, o] = await Promise.all([
      api(API + '/players/all'),
      api(API + '/players')
    ]);
    players = p || [];
    online = (o && o.players) ? o.players : [];
    render();
    document.getElementById('stat-online').textContent = online.length;
    document.getElementById('stat-total').textContent = players.length;
  } catch (e) {
    toast('Failed to load: ' + e.message, 'err');
  }
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  let list = players.filter(p => {
    if (!q) return true;
    return (p.username||'').toLowerCase().includes(q) || (p.uuid||'').toLowerCase().includes(q);
  });
  const onlineSet = new Set(online);
  let html = '<table><thead><tr><th></th><th>Player</th><th>UUID</th><th>Rank</th><th>Badge</th><th>Last Seen</th></tr></thead><tbody>';
  if (list.length === 0) {
    html += '<tr><td colspan="6" class="empty">No players found</td></tr>';
  }
  for (const p of list) {
    const isOnline = onlineSet.has(p.username);
    html += '<tr>';
    html += '<td><span class="online-dot ' + (isOnline ? 'on' : 'off') + '"></span></td>';
    html += '<td><span class="clickable" onclick="editPlayer(\'' + p.uuid + '\')">' + esc(p.username || p.uuid) + '</span></td>';
    html += '<td class="uuid" title="' + esc(p.uuid) + '">' + esc(p.uuid) + '</td>';
    html += '<td>' + rankBadge(p.rank) + '</td>';
    html += '<td>' + (p.equipped_badge || '-') + '</td>';
    html += '<td>' + (p.last_seen ? new Date(p.last_seen*1000).toLocaleString() : '-') + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('table').innerHTML = html;
}

function rankBadge(rank) {
  const cls = (rank === 'ADMIN') ? 'admin' : (rank === 'VIP' ? 'vip' : 'default');
  return '<span class="rank-badge ' + cls + '">' + esc(rank||'DEFAULT') + '</span>';
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function editPlayer(uuid) {
  try {
    editing = await api(API + '/profile/' + uuid);
    document.getElementById('modal-title').textContent = 'Edit: ' + editing.username;
    document.getElementById('modal-body').innerHTML = buildForm(editing);
    document.getElementById('modal').classList.add('open');
  } catch (e) {
    toast('Failed: ' + e.message, 'err');
  }
}

function showCreate() {
  editing = {
    uuid: prompt('Enter player UUID (no dashes):') || 'custom-' + Date.now(),
    username: prompt('Enter username:') || 'Player',
    rank: 'ADMIN',
    plus_color: 0x00FFAA00,
    logo_color: 0xFFAA0000,
    logo_always_show: true,
    artist_tools: true,
    tester_tools: true,
    equipped_cosmetics: [],
    equipped_emotes: [],
    equipped_badge: 0,
    equipped_sprays: [],
    owned_cosmetics: allIds(500),
    owned_emotes: allIds(200),
    owned_badges: allIds(100),
    owned_sprays: allIds(100),
    vis_cloth_cloak: false,
    vis_hats_over_helmet: true,
    vis_hats_over_skin: true,
    vis_over_chestplate: true,
    vis_over_leggings: true,
    vis_over_boots: true,
    vis_flip_shoulder: false
  };
  document.getElementById('modal-title').textContent = 'Create Player';
  document.getElementById('modal-body').innerHTML = buildForm(editing);
  document.getElementById('modal').classList.add('open');
}

function buildForm(p) {
  return `
    <div class="field-row">
      <div class="field"><label>Username</label><input id="f-username" value="${esc(p.username||'')}"></div>
      <div class="field"><label>Rank</label><select id="f-rank">
        <option ${p.rank==='ADMIN'?'selected':''}>ADMIN</option>
        <option ${p.rank==='MOD'?'selected':''}>MOD</option>
        <option ${p.rank==='VIP'?'selected':''}>VIP</option>
        <option ${p.rank==='MVP'?'selected':''}>MVP</option>
        <option ${p.rank==='DEFAULT'?'selected':''}>DEFAULT</option>
      </select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Plus Color (hex)</label><input id="f-plus" value="${p.plus_color.toString(16).padStart(8,'0')}" placeholder="00FFAA00"></div>
      <div class="field"><label>Logo Color (hex)</label><input id="f-logo" value="${p.logo_color.toString(16).padStart(8,'0')}" placeholder="FFAA0000"></div>
    </div>
    <div class="field"><label>Equipped Badge ID</label><input id="f-badge" type="number" value="${p.equipped_badge}"></div>
    <div class="field">
      <label>Equipped Cosmetics (comma-separated IDs)</label>
      <input id="f-cosmetics" value="${(p.equipped_cosmetics||[]).join(',')}" placeholder="1,2,3">
    </div>
    <div class="field">
      <label>Equipped Emotes (comma-separated IDs)</label>
      <input id="f-emotes" value="${(p.equipped_emotes||[]).join(',')}" placeholder="1,5,10">
    </div>
    <div class="field">
      <label>Equipped Sprays (comma-separated IDs)</label>
      <input id="f-sprays" value="${(p.equipped_sprays||[]).join(',')}" placeholder="1,2">
    </div>`;
}

function parseCSV(s) { return (s||'').split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x)); }

async function saveProfile() {
  try {
    const body = {
      rank: document.getElementById('f-rank').value,
      plus_color: parseInt(document.getElementById('f-plus').value, 16),
      logo_color: parseInt(document.getElementById('f-logo').value, 16),
      equipped_badge: parseInt(document.getElementById('f-badge').value) || 0,
      equipped_cosmetics: parseCSV(document.getElementById('f-cosmetics').value),
      equipped_emotes: parseCSV(document.getElementById('f-emotes').value),
      equipped_sprays: parseCSV(document.getElementById('f-sprays').value),
    };
    if (editing.username !== document.getElementById('f-username').value) {
      body.username = document.getElementById('f-username').value;
    }
    await fetch(API + '/profile/' + editing.uuid, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    closeModal();
    loadPlayers();
    toast('Saved');
  } catch (e) {
    toast('Save failed: ' + e.message, 'err');
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editing = null;
}

function allIds(n) {
  const a = [];
  for (let i = 1; i <= n; i++) a.push(i);
  return a;
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type||'ok') + ' show';
  setTimeout(() => el.classList.remove('show'), 2500);
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadPlayers();
setInterval(loadPlayers, 15000);
</script>
</body>
</html>
